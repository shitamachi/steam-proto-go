# Generated with protoc-gen-openapi
# https://github.com/google/gnostic/tree/master/cmd/protoc-gen-openapi

openapi: 3.0.3
info:
    title: steam-api
    version: 0.0.1
paths:
    /v1/steamallgames/apps:
        get:
            tags:
                - SteamAllGamesService
            description: GetAppListV2 使用 ISteamApps/GetAppList/v2 获取全部应用列表（一次性返回）。
            operationId: SteamAllGamesService_GetAppListV2
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/steamallgames.v1.GetAppListV2Response'
    /v1/steamallgames/store-apps:
        get:
            tags:
                - SteamAllGamesService
            description: |-
                GetStoreAppList 使用 IStoreService/GetAppList/v1 获取单页应用列表，
                 调用方用 last_appid/have_more_results 循环翻页取全量。
                 服务端单页上限 5k（请求更大值会被钳制），避免大包超 gRPC 消息限制。
            operationId: SteamAllGamesService_GetStoreAppList
            parameters:
                - name: ifModifiedSince
                  in: query
                  description: 仅返回该时间戳之后修改的应用。
                  schema:
                    type: integer
                    format: uint32
                - name: haveDescriptionLanguage
                  in: query
                  description: 描述语言过滤。
                  schema:
                    type: string
                - name: includeGames
                  in: query
                  description: 是否包含游戏。未指定时按 false 处理（与 store API 默认值对齐）。
                  schema:
                    type: boolean
                - name: includeDlc
                  in: query
                  description: 是否包含 DLC。
                  schema:
                    type: boolean
                - name: includeSoftware
                  in: query
                  description: 是否包含软件。
                  schema:
                    type: boolean
                - name: includeVideos
                  in: query
                  description: 是否包含视频。
                  schema:
                    type: boolean
                - name: includeHardware
                  in: query
                  description: 是否包含硬件。
                  schema:
                    type: boolean
                - name: lastAppid
                  in: query
                  description: 分页：从该 appid 之后开始返回。
                  schema:
                    type: integer
                    format: uint32
                - name: maxResults
                  in: query
                  description: 每页最大数量，默认 10k，最大 50k。
                  schema:
                    type: integer
                    format: uint32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/steamallgames.v1.GetStoreAppListResponse'
    /v1/steamdb/apps/{appId}:
        get:
            tags:
                - SteamDBService
            description: |-
                GetAppPage 抓取单个 App 的 SteamDB 信息页，可选附带子页（charts/depots/configs）。
                 返回 raw_json 为上游解析后的 JSON（含 name/developer/价格/tags/DLC/社交链接等）。
                 注意：history/stats/patchnotes 子页为 JS 渲染，上游不支持。
            operationId: SteamDBService_GetAppPage
            parameters:
                - name: appId
                  in: path
                  description: Steam AppID。
                  required: true
                  schema:
                    type: integer
                    format: int32
                - name: cc
                  in: query
                  description: 国家代码（价格展示用），默认 ca。
                  schema:
                    type: string
                - name: subpages
                  in: query
                  description: 需要一并抓取的子页列表：charts / depots / configs / all。
                  schema:
                    type: array
                    items:
                        type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/steamdb.v1.GetAppPageReply'
    /v1/steamdb/enrich:
        get:
            tags:
                - SteamDBService
            description: |-
                EnrichAppIDs 富化一组 AppID（SteamDB 扩展 API 玩家统计/历史最低价 +
                 Steam Store 详情 + 在线人数 + 评论摘要 + SteamSpy），不抓取 SteamDB 页面，
                 是大批量 per-appid 数据的低风险通道。
                 上游同步串行处理，单个 AppID 约 2~3s，调用方需控制 app_ids 数量（网关超时 120s）。
            operationId: SteamDBService_EnrichAppIDs
            parameters:
                - name: appIds
                  in: query
                  description: 要富化的 AppID 列表（上游单次上限 50，建议 ≤ 30 以避开网关超时）。
                  schema:
                    type: array
                    items:
                        type: integer
                        format: int32
                - name: currencies
                  in: query
                  description: 逗号分隔的币种列表，如 "CNY,USD"（默认 USD,EUR,GBP；每多一个币种 = 每 AppID 多一次上游调用）。
                  schema:
                    type: string
                - name: noDetails
                  in: query
                  description: 是否跳过 Steam 商店详情。
                  schema:
                    type: boolean
                - name: noPrices
                  in: query
                  description: 是否跳过历史最低价。
                  schema:
                    type: boolean
                - name: noSteamspy
                  in: query
                  description: 是否跳过 SteamSpy 数据。
                  schema:
                    type: boolean
                - name: delaySeconds
                  in: query
                  description: 相邻 AppID 之间的间隔秒数（0~10，默认 0.3），防止打爆上游。
                  schema:
                    type: number
                    format: double
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/steamdb.v1.EnrichAppIDsReply'
    /v1/steamdb/lists:
        get:
            tags:
                - SteamDBService
            description: GetListPage 抓取 SteamDB 列表页（榜单/即将发售/当前折扣），返回 raw_json。
            operationId: SteamDBService_GetListPage
            parameters:
                - name: kind
                  in: query
                  description: 列表页类型。
                  schema:
                    type: integer
                    format: enum
                - name: chartType
                  in: query
                  description: kind=CHARTS 时必填：topsellers / mostwished / mostplayed / topnew / trending。
                  schema:
                    type: string
                - name: cc
                  in: query
                  description: 国家代码（价格展示用），默认 ca。
                  schema:
                    type: string
                - name: week
                  in: query
                  description: kind=UPCOMING 时可选：周标识，如 2025W26；为空则取当前周。
                  schema:
                    type: string
                - name: displayOnly
                  in: query
                  description: kind=UPCOMING 时可选：类型过滤（Game/DLC/...），默认 Game。
                  schema:
                    type: string
                - name: minDiscount
                  in: query
                  description: kind=SALES 时可选：最低折扣百分比（0~100）。
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/steamdb.v1.GetListPageReply'
    /v1/steamdetail/appdetails:
        get:
            tags:
                - SteamDetailService
            description: |-
                GetAppDetails 获取指定应用（appids）的详情数据。
                 返回的 raw_json 为 api/appdetails 接口的原始 JSON 响应体
                 （以 appid 为 key 的应用详情 map），解析与落库由调用方完成。
            operationId: SteamDetailService_GetAppDetails
            parameters:
                - name: appIds
                  in: query
                  description: 要查询的应用 ID 列表。
                  schema:
                    type: array
                    items:
                        type: integer
                        format: int32
                - name: language
                  in: query
                  description: Steam 语言代码，如 schinese / english。
                  schema:
                    type: string
                - name: currency
                  in: query
                  description: Steam 货币代码，如 cn / us。
                  schema:
                    type: string
                - name: filters
                  in: query
                  description: 过滤字段列表（filters），为空时不限制。
                  schema:
                    type: array
                    items:
                        type: string
                - name: noPriceOverview
                  in: query
                  description: 是否不使用 price_overview 过滤（为 true 时 filters 参数生效）。
                  schema:
                    type: boolean
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/steamdetail.v1.AppDetails'
    /v1/steamonline/players/{appId}:
        get:
            tags:
                - SteamOnlineService
            description: |-
                GetOnlinePlayers 返回指定游戏当前的 Steam 在线玩家数。
                 source 为空时由服务端按内置策略选择数据源。
                 返回 NOT_FOUND 表示该 app 不存在或无法获取在线玩家数。
            operationId: SteamOnlineService_GetOnlinePlayers
            parameters:
                - name: appId
                  in: path
                  description: 游戏的 Steam AppID。
                  required: true
                  schema:
                    type: integer
                    format: int32
                - name: source
                  in: query
                  description: |-
                    可选数据源，枚举值：
                       * `web_api` - Steam Web API
                       * `steam_community_html` - Steam 社区 HTML（走负载均衡 URL）
                       * `local_request_steam_community_html_with_proxy` - 本地代理请求社区 HTML
                       * `forward_request_remote_server` - 转发请求到远程服务器
                     为空时由服务端按内置策略选择。
                  schema:
                    type: integer
                    format: enum
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/steamonline.v1.OnlinePlayers'
    /v1/steamreview/pages/{appId}:
        get:
            tags:
                - SteamReviewService
            description: |-
                FetchReviewsPage 获取单页 Steam 评论原始数据。
                 返回的 raw_json 为 appreviews 接口的原始 JSON 响应体
                 （包含 reviews / cursor / query_summary 等字段），解析与落库由调用方完成。
            operationId: SteamReviewService_FetchReviewsPage
            parameters:
                - name: appId
                  in: path
                  description: 游戏的 Steam AppID。
                  required: true
                  schema:
                    type: integer
                    format: int32
                - name: cursor
                  in: query
                  description: 分页游标，首页传 "*"。
                  schema:
                    type: string
                - name: numPerPage
                  in: query
                  description: 每页评论数量。
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/steamreview.v1.ReviewsPage'
    /v1/steamspecials/pages:
        get:
            tags:
                - SteamSpecialsService
            description: |-
                FetchSpecialsPage 获取单页折扣游戏列表。
                 返回的 results_html 为搜索接口返回的原始 HTML 片段，
                 由调用方负责解析为游戏条目。
            operationId: SteamSpecialsService_FetchSpecialsPage
            parameters:
                - name: start
                  in: query
                  description: 起始偏移量（第几个游戏开始），0 为首页。
                  schema:
                    type: integer
                    format: int32
                - name: count
                  in: query
                  description: 每页数量。
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/steamspecials.v1.SpecialsPage'
    /v1/todos/create:
        post:
            tags:
                - TodoService
            description: |-
                CreateTodo creates a new todo item and returns the persisted record
                 with the server-assigned id, create_time, and update_time populated.
                 Returns INVALID_ARGUMENT if the request payload fails validation.
            operationId: TodoService_CreateTodo
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/todo.v1.Todo'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/todo.v1.Todo'
    /v1/todos/list:
        get:
            tags:
                - TodoService
            description: |-
                ListTodos returns a page of todo items, optionally filtered and ordered.
                 Use the next_page_token from TodoSet to retrieve subsequent pages.
                 Returns INVALID_ARGUMENT if filter, order_by, or page_token are malformed.
            operationId: TodoService_ListTodos
            parameters:
                - name: pageSize
                  in: query
                  description: |-
                    Optional. Maximum number of todo items to return in a single page.
                     The server may apply a default and a maximum when unset or out of range.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    Optional. Token from a previous response's next_page_token used to fetch
                     the next page. Leave empty to request the first page.
                  schema:
                    type: string
                - name: filter
                  in: query
                  description: |-
                    Optional. The standard list filter.
                     Supported fields:
                        * `title` (i.e. `title:"bug"`)
                        * `content` (i.e. `content:"docs"`)
                        * `completed` (i.e. `completed` or `NOT completed`)
                        * `create_time` range (i.e. `create_time>="2026-01-01T00:00:00Z"`)
                  schema:
                    type: string
                - name: orderBy
                  in: query
                  description: |-
                    Optional. A comma-separated list of fields to order by.
                     Supported fields:
                        * `id`
                        * `title`
                        * `create_time`
                        * `update_time`
                     Append ` desc` to a field for descending order, e.g. `create_time desc`.
                     Defaults to ascending order when no direction is supplied.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/todo.v1.TodoSet'
    /v1/todos/sync:
        post:
            tags:
                - TodoService
            description: |-
                SyncTodos opens a bidirectional stream for two-way synchronization.
                 The client sends SyncTodoRequest messages describing local changes, and
                 the server pushes back TodoEvent messages reflecting the resulting state.
                 The stream stays open until either side closes it.
            operationId: TodoService_SyncTodos
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/todo.v1.SyncTodoRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/todo.v1.TodoEvent'
    /v1/todos/update:
        put:
            tags:
                - TodoService
            description: |-
                UpdateTodo applies a partial update to an existing todo item using a
                 FieldMask. Only the fields listed in update_mask are overwritten; all
                 other fields are left unchanged.
                 Returns NOT_FOUND if the target todo does not exist, or
                 INVALID_ARGUMENT if update_mask references unknown fields.
            operationId: TodoService_UpdateTodo
            parameters:
                - name: updateMask
                  in: query
                  description: |-
                    Set of field paths in todo to overwrite. Fields not listed are left
                     unchanged. Use a single path of `*` to replace every mutable field.
                  schema:
                    type: string
                    format: field-mask
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/todo.v1.Todo'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/todo.v1.Todo'
    /v1/todos/watch:
        get:
            tags:
                - TodoService
            description: |-
                WatchTodos opens a server-side stream that emits a TodoEvent for every
                 create, update, or delete that matches the supplied filter and ordering.
                 The stream remains open until the client cancels or the server terminates it.
            operationId: TodoService_WatchTodos
            parameters:
                - name: pageSize
                  in: query
                  description: |-
                    Optional. Maximum number of todo items returned in the initial snapshot
                     before live events begin streaming.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: Optional. Page token used to resume from a prior snapshot.
                  schema:
                    type: string
                - name: filter
                  in: query
                  description: Optional. List filter expression. Same syntax as ListTodosRequest.filter.
                  schema:
                    type: string
                - name: orderBy
                  in: query
                  description: Optional. Order specification. Same syntax as ListTodosRequest.order_by.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/todo.v1.TodoEvent'
    /v1/todos/{id}:
        get:
            tags:
                - TodoService
            description: |-
                GetTodo returns a single todo item by its id.
                 Returns NOT_FOUND if no todo exists with the supplied id.
            operationId: TodoService_GetTodo
            parameters:
                - name: id
                  in: path
                  description: Unique identifier of the todo item to retrieve.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/todo.v1.Todo'
        delete:
            tags:
                - TodoService
            description: |-
                DeleteTodo permanently removes a todo item by its id.
                 Returns NOT_FOUND if no todo exists with the supplied id.
            operationId: TodoService_DeleteTodo
            parameters:
                - name: id
                  in: path
                  description: Unique identifier of the todo item to delete.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
components:
    schemas:
        steamallgames.v1.AppInfo:
            type: object
            properties:
                appid:
                    type: integer
                    description: 应用 ID。
                    format: int32
                name:
                    type: string
                    description: 应用名称。
            description: AppInfo 是一个 Steam 应用的基本信息（ISteamApps/GetAppList/v2）。
        steamallgames.v1.GetAppListV2Response:
            type: object
            properties:
                apps:
                    type: array
                    items:
                        $ref: '#/components/schemas/steamallgames.v1.AppInfo'
                    description: 全部应用列表。
            description: GetAppListV2Response 是 SteamAllGamesService.GetAppListV2 的输出。
        steamallgames.v1.GetStoreAppListResponse:
            type: object
            properties:
                apps:
                    type: array
                    items:
                        $ref: '#/components/schemas/steamallgames.v1.StoreAppInfo'
                    description: 本页应用列表。
                lastAppid:
                    type: integer
                    description: 最后返回的应用 ID。
                    format: uint32
                haveMoreResults:
                    type: boolean
                    description: 是否还有更多结果。
            description: GetStoreAppListResponse 是 SteamAllGamesService.GetStoreAppList 的输出。
        steamallgames.v1.StoreAppInfo:
            type: object
            properties:
                appid:
                    type: string
                    description: 应用 ID。
                name:
                    type: string
                    description: 应用名称。
                lastModified:
                    type: integer
                    description: 最后修改时间戳。
                    format: uint32
                priceChangeNumber:
                    type: integer
                    description: 价格变更号。
                    format: uint32
            description: StoreAppInfo 是一个 Steam 商店应用信息（IStoreService/GetAppList/v1）。
        steamdb.v1.EnrichAppIDsReply:
            type: object
            properties:
                fetchedAt:
                    type: string
                    description: 上游处理时间（ISO8601）。
                apps:
                    type: array
                    items:
                        $ref: '#/components/schemas/steamdb.v1.SteamDBEnrichedApp'
                    description: 成功富化的 App 列表（失败/不存在的 AppID 会被上游跳过）。
            description: EnrichAppIDsReply 是一次批量富化结果。
        steamdb.v1.GetAppPageReply:
            type: object
            properties:
                appId:
                    type: integer
                    description: Steam AppID。
                    format: int32
                rawJson:
                    type: string
                    description: 上游返回的原始 JSON（info 页字段 + 可选 charts/depots/configs 子对象）。
                    format: bytes
            description: GetAppPageReply 是 App 信息页抓取结果。
        steamdb.v1.GetListPageReply:
            type: object
            properties:
                kind:
                    type: integer
                    description: 列表页类型（回显）。
                    format: enum
                paramsJson:
                    type: string
                    description: 请求参数回显（JSON，如 {"chart_type":"topsellers"}）。
                    format: bytes
                rawJson:
                    type: string
                    description: 上游返回的原始 JSON（榜单 items / upcoming games / sales 列表）。
                    format: bytes
            description: GetListPageReply 是列表页抓取结果。
        steamdb.v1.SteamDBEnrichedApp:
            type: object
            properties:
                appId:
                    type: integer
                    description: Steam AppID。
                    format: int32
                rawJson:
                    type: string
                    description: |-
                        上游富化结果的原始 JSON（player_stats / lowest_prices / reviews / steamspy 等），
                         解析与落库由调用方完成。
                    format: bytes
            description: SteamDBEnrichedApp 是单个 App 的富化结果。
        steamdetail.v1.AppDetails:
            type: object
            properties:
                appIds:
                    type: array
                    items:
                        type: integer
                        format: int32
                    description: 查询的应用 ID 列表。
                rawJson:
                    type: string
                    description: api/appdetails 接口返回的原始 JSON 响应体。
                    format: bytes
            description: AppDetails 是一次应用详情查询结果。
        steamonline.v1.OnlinePlayers:
            type: object
            properties:
                appId:
                    type: integer
                    description: 游戏的 Steam AppID。
                    format: int32
                playerCount:
                    type: integer
                    description: 当前在线玩家数。
                    format: int32
                source:
                    type: integer
                    description: 实际使用的数据源，取值见 GetOnlinePlayersRequest.source。
                    format: enum
                fetchedAt:
                    type: string
                    description: 抓取完成时间。
                    format: date-time
            description: OnlinePlayers 是一次在线玩家数查询结果。
        steamreview.v1.ReviewsPage:
            type: object
            properties:
                appId:
                    type: integer
                    description: 游戏的 Steam AppID。
                    format: int32
                rawJson:
                    type: string
                    description: appreviews 接口返回的原始 JSON 响应体。
                    format: bytes
            description: ReviewsPage 是一页 Steam 评论抓取结果。
        steamspecials.v1.SpecialsPage:
            type: object
            properties:
                success:
                    type: integer
                    description: 接口状态码，1 表示成功。
                    format: int32
                resultsHtml:
                    type: string
                    description: 搜索结果的原始 HTML 片段。
                totalCount:
                    type: integer
                    description: 折扣游戏总数。
                    format: int32
                start:
                    type: integer
                    description: 当前页起始偏移量。
                    format: int32
                pagesize:
                    type: integer
                    description: 每页数量。
                    format: int32
            description: SpecialsPage 是一页折扣游戏列表结果。
        todo.v1.SyncTodoRequest:
            type: object
            properties:
                action:
                    type: string
                    description: The operation to perform. One of `create`, `update`, or `delete`.
                todo:
                    allOf:
                        - $ref: '#/components/schemas/todo.v1.Todo'
                    description: Payload for `create` and `update` actions. Ignored for `delete`.
                id:
                    type: string
                    description: Identifier of the target todo. Required for `delete` and `update`.
                updateMask:
                    type: string
                    description: |-
                        Field mask used by `update` actions to limit which fields are overwritten.
                         Ignored for `create` and `delete`.
                    format: field-mask
            description: |-
                SyncTodoRequest is a single client message in the SyncTodos bidirectional
                 stream. The action field selects which operation to perform on the server.
        todo.v1.Todo:
            type: object
            properties:
                id:
                    type: string
                    description: Server-assigned unique identifier. Read-only on create.
                title:
                    type: string
                    description: Short human-readable title.
                content:
                    type: string
                    description: Detailed description or notes for the todo item.
                completed:
                    type: boolean
                    description: Whether the todo item has been completed.
                createTime:
                    type: string
                    description: Time at which the todo item was created. Server-assigned, read-only.
                    format: date-time
                updateTime:
                    type: string
                    description: Time at which the todo item was last modified. Server-assigned, read-only.
                    format: date-time
            description: Todo is the canonical representation of a todo item.
        todo.v1.TodoEvent:
            type: object
            properties:
                action:
                    type: string
                    description: The change that occurred. One of `created`, `updated`, or `deleted`.
                todo:
                    allOf:
                        - $ref: '#/components/schemas/todo.v1.Todo'
                    description: |-
                        The todo item after the change. For `deleted` events only the id field
                         is guaranteed to be populated.
                eventTime:
                    type: string
                    description: Time at which the change was observed by the server.
                    format: date-time
            description: |-
                TodoEvent is a server-sent message describing a change to a todo item.
                 It is emitted by both WatchTodos and SyncTodos streams.
        todo.v1.TodoSet:
            type: object
            properties:
                todos:
                    type: array
                    items:
                        $ref: '#/components/schemas/todo.v1.Todo'
                    description: The page of todo items in the order requested by ListTodosRequest.order_by.
                nextPageToken:
                    type: string
                    description: |-
                        Token used to retrieve the next page via ListTodosRequest.page_token.
                         Empty when there are no more results.
            description: TodoSet is a paginated collection of todo items returned by ListTodos.
tags:
    - name: SteamAllGamesService
      description: |-
        SteamAllGamesService 提供 Steam 应用列表抓取能力。
         对应 steam-tasks 中 handlers/steam_all_games 的 SteamAppListAPI 客户端逻辑。
    - name: SteamDBService
      description: |-
        SteamDBService 提供 SteamDB 数据源代理能力（lg-steamdb-scraper HTTP 服务）。
         上游为部署在集群内的 steamdb-scraper（默认 https://steamdb.k.mygo.rocks），
         负责Cloudflare 绕过与多数据源富化；本服务只做透传与轻量封装。
    - name: SteamDetailService
      description: |-
        SteamDetailService 提供 Steam 应用详情抓取能力。
         对应 steam-tasks 中 handlers/steam_detail 的 SteamAppDetailAPI 客户端逻辑。
    - name: SteamOnlineService
      description: |-
        SteamOnlineService 提供 Steam 在线玩家数查询能力。
         对应 steam-tasks 中 handlers/steam_online 的 SteamOnlineAPI 客户端逻辑，
         支持四种数据源抓取在线玩家数。
    - name: SteamReviewService
      description: |-
        SteamReviewService 提供 Steam 评论抓取能力。
         对应 steam-tasks 中 handlers/steam_review 的 SteamReviewsAPI 客户端逻辑。
    - name: SteamSpecialsService
      description: |-
        SteamSpecialsService 提供 Steam 折扣游戏列表抓取能力。
         对应 steam-tasks 中 handlers/steam_specials 的 SteamSpecialsAPI 客户端逻辑。
    - name: TodoService
      description: |-
        TodoService provides a simple CRUD example for managing todo items.
         It demonstrates unary, server-streaming, and bidirectional-streaming RPCs
         together with AIP-style list filtering, ordering, and pagination.
